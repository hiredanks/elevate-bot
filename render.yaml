services:
  - type: web
    name: elevate-bot
    runtime: node
    # The free plan sleeps after 15 minutes without web traffic, which would take the bot offline.
    plan: starter
    # Closest Render region to the Supabase database in London. It cannot be changed after the first deploy.
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: the public community website's address.
      - key: SITE_URL
        sync: false
      # Stream alerts. Leave empty for platforms you do not use.
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Optional "Log in with Epic Games" for scrims.
      - key: EPIC_CLIENT_ID
        sync: false
      - key: EPIC_CLIENT_SECRET
        sync: false
